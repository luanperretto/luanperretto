<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUAN PERRETTO | PORTFÓLIO</title>
  
  <!-- Fonte Roboto do Google Fonts (Pesos: 400 Normal, 500 Medium, 700 Bold) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Ícones das redes sociais (FontAwesome) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    /* Rolagem suave */
    html { 
      scroll-behavior: smooth; 
    }

    body { 
      color: #111; 
      background-color: #fff; 
      padding: 0 20px; 
      max-width: 650px; 
      margin: 0 auto; 
      line-height: 1.6; 
    }
    
    /* Anchor para o topo fixo */
    #topo {
      scroll-margin-top: 10px;
    }

    /* Menu superior fixo com botões/caixinhas */
    nav { 
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      border-bottom: 1px solid #ddd; 
      padding-top: 20px;
      padding-bottom: 15px; 
      margin-bottom: 40px; 
      position: sticky;
      top: 0;
      background-color: #fff;
      z-index: 10;
    }

    nav a { 
      font-family: 'Roboto', sans-serif;
      font-weight: 500; /* Roboto Seminegrito */
      font-size: 15px;
      text-decoration: none; 
      color: #333; 
      background-color: #f4f5f7;
      padding: 8px 0;
      text-align: center;
      border-radius: 6px;
      transition: background-color 0.2s, color 0.2s; 
    }
    nav a:hover { 
      background-color: #e2e8f0; 
      color: #000; 
    }

    /* Ajuste fino da parada do scroll nas seções */
    #contato, #sobre, #trabalhos {
      scroll-margin-top: 75px;
    }

    /* Cabeçalho Principal */
    h1 { 
      font-family: 'Roboto', sans-serif;
      font-size: 46px; 
      font-weight: 700; 
      margin-bottom: 6px; 
      color: #111; 
      line-height: 1.2;
    }

    /* Subtítulo em Roboto Normal */
    .subtitle { 
      font-family: 'Roboto', sans-serif;
      font-size: 18px; 
      font-weight: 400; 
      letter-spacing: 0.5px; 
      color: #444; 
      margin-bottom: 40px; 
    }
    
    /* Estilo das Seções */
    section { margin-bottom: 40px; }
    .section-title { 
      font-family: 'Roboto', sans-serif;
      font-size: 26px; 
      font-weight: 500; /* Roboto Seminegrito */
      border-top: 1px solid #ddd; 
      padding-top: 20px; 
      margin-bottom: 25px; 
      color: #111;
    }

    /* Redes Sociais e E-mail */
    .social-links { display: flex; gap: 12px; margin-bottom: 15px; }
    .social-links a { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      width: 40px; 
      height: 40px; 
      background-color: #f4f5f7; 
      border-radius: 50%; 
      color: #000; 
      text-decoration: none; 
      font-size: 18px; 
      transition: background-color 0.2s, transform 0.2s; 
    }
    .social-links a:hover { 
      background-color: #e2e8f0; 
      transform: translateY(-2px); 
    }

    .email-text {
      font-family: 'Roboto', sans-serif;
      font-weight: 400;
      font-size: 15px;
      color: #222;
    }
    .email-text a {
      color: #222;
      text-decoration: none;
    }
    .email-text a:hover {
      text-decoration: underline;
    }

    /* Biografia em Roboto Normal */
    .bio { 
      font-family: 'Roboto', sans-serif;
      font-size: 16px; 
      font-weight: 400; 
      color: #222; 
    }

    /* Galeria de Trabalhos */
    .gallery {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      display: block;
    }

    /* Rodapé ajustado sem folgas excedentes */
    footer {
      margin-top: 40px;
      padding: 20px 0 30px 0;
      border-top: 1px solid #ddd;
      text-align: center;
    }

    .back-to-top {
      display: inline-block;
      font-family: 'Roboto', sans-serif;
      font-weight: 500; /* Roboto Seminegrito */
      font-size: 15px;
      text-decoration: none;
      color: #333;
      background-color: #f4f5f7;
      padding: 10px 30px;
      border-radius: 6px;
      transition: background-color 0.2s, color 0.2s;
    }

    .back-to-top:hover {
      background-color: #e2e8f0;
      color: #000;
    }
  </style>
</head>
<body>

  <!-- Ponto de referência para o topo -->
  <div id="topo"></div>

  <!-- Menu superior com caixinhas -->
  <nav>
    <a href="#topo">Início</a>
    <a href="#contato">Contato</a>
    <a href="#sobre">Sobre</a>
    <a href="#trabalhos">Trabalhos</a>
  </nav>

  <!-- Cabeçalho Principal -->
  <h1>Luan Perretto</h1>
  <div class="subtitle">Editor de Geografia | Cartógrafo</div>

  <!-- Seção Contato -->
  <section id="contato">
    <h2 class="section-title">Contato</h2>
    
    <!-- Redes Sociais -->
    <div class="social-links">
      <!-- LinkedIn -->
      <a href="https://www.linkedin.com/in/luanperretto/?skipRedirect=true" target="_blank" title="LinkedIn">
        <i class="fa-brands fa-linkedin-in"></i>
      </a>
      <!-- GitHub -->
      <a href="https://github.com/luanperretto" target="_blank" title="GitHub">
        <i class="fa-brands fa-github"></i>
      </a>
      <!-- Substack -->
      <a href="https://substack.com/@luanperretto" target="_blank" title="Substack">
        <i class="fa-solid fa-bookmark"></i>
      </a>
    </div>

    <!-- E-mail -->
    <div class="email-text">
      <a href="mailto:luan.perretto@gmail.com">luan.perretto@gmail.com</a>
    </div>
  </section>

  <!-- Seção Sobre -->
  <section id="sobre">
    <h2 class="section-title">Sobre</h2>
    <div class="bio">
      Editor de Geografia e cartógrafo explorando o Brasil e o mundo através de textos mapas e infográficos.
    </div>
  </section>

  <!-- Seção Trabalhos -->
  <section id="trabalhos">
    <h2 class="section-title">Trabalhos</h2>

    <div class="gallery">
      <img src="imagem1.png" alt="Trabalho 1">
      <img src="imagem2.png" alt="Trabalho 2">
      <img src="imagem3.png" alt="Trabalho 3">
      <img src="imagem4.png" alt="Trabalho 4">
      <img src="imagem5.gif" alt="Trabalho 5">
      <img src="imagem6.png" alt="Trabalho 6">
      <img src="imagem7.png" alt="Trabalho 7">
      <img src="imagem8.png" alt="Trabalho 8">
      <img src="imagem9.gif" alt="Trabalho 9">
      <img src="imagem10.png" alt="Trabalho 10">
    </div>
  </section>

  <!-- Rodapé -->
  <footer>
    <a href="#topo" class="back-to-top">Voltar</a>
  </footer>

</body>
</html>
