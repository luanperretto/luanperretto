<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUAN PERRETTO | PORTFÓLIO</title>
  <!-- Ícones das redes sociais (FontAwesome) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Courier New', Courier, monospace; 
    }
    
    /* Efeito de rolagem suave quando clica nas abas */
    html { scroll-behavior: smooth; }

    body { 
      color: #111; 
      background-color: #fff; 
      padding: 20px; 
      max-width: 650px; 
      margin: 0 auto; 
      line-height: 1.6; 
      /* Espaço no final para rolagem completa até o último item */
      padding-bottom: 450px; 
    }
    
    /* Menu superior fixo */
    nav { 
      display: flex; 
      justify-content: space-between; 
      border-bottom: 1px solid #ddd; 
      padding-bottom: 15px; 
      margin-bottom: 40px; 
      letter-spacing: 1px; 
      font-size: 14px; 
      position: sticky;
      top: 0;
      background-color: #fff;
      padding-top: 10px;
      z-index: 10;
    }
    nav a { 
      text-decoration: none; 
      color: #555; 
      font-weight: bold; 
      text-transform: uppercase; 
      transition: color 0.2s; 
    }
    nav a:hover { color: #000; }

    /* Posição exata do travamento da rolagem */
    #contato, #sobre, #trabalhos {
      scroll-margin-top: 90px;
    }

    /* Cabeçalho */
    h1 { 
      font-size: 28px; 
      font-weight: bold; 
      margin-bottom: 10px; 
      color: #111; 
    }
    .subtitle { 
      font-size: 13px; 
      letter-spacing: 1px; 
      color: #444; 
      margin-bottom: 25px; 
      text-transform: uppercase; 
    }
    
    /* Redes Sociais */
    .social-links { display: flex; gap: 12px; margin-bottom: 40px; }
    .social-links a { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      width: 40px; 
      height: 40px; 
      background-color: #f4f5f7; 
      border-radius: 50%; 
      color: #000; 
      text-decoration: none; 
      font-size: 18px; 
      transition: background-color 0.2s, transform 0.2s; 
    }
    .social-links a:hover { 
      background-color: #e2e8f0; 
      transform: translateY(-2px); 
    }

    /* Biografia */
    .bio { font-size: 15px; margin-bottom: 40px; color: #222; }

    /* Seções com rolagem */
    section { padding-top: 20px; margin-bottom: 40px; }
    .section-title { 
      font-size: 20px; 
      font-weight: bold; 
      border-top: 1px solid #ddd; 
      padding-top: 20px; 
      margin-bottom: 25px; 
    }

    /* GALERIA VERTICAL DE TRABALHOS */
    .gallery {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    /* Estilo para PNGs e GIFs */
    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      display: block;
      transition: transform 0.2s ease;
    }

    .gallery img:hover {
      transform: scale(1.01);
    }
  </style>
</head>
<body>

  <!-- Menu ajustado -->
  <nav>
    <a href="#contato">Contato</a>
    <a href="#sobre">Sobre</a>
    <a href="#trabalhos">Trabalhos</a>
  </nav>

  <!-- Cabeçalho Principal -->
  <h1>Luan Perretto</h1>
  <div class="subtitle">Editor de Geografia | Cartógrafo | Infografista</div>

  <!-- Redes Sociais (Seção de Contato) -->
  <div class="social-links" id="contato">
    <!-- LinkedIn -->
    <a href="https://www.linkedin.com/in/luanperretto/?skipRedirect=true" target="_blank" title="LinkedIn">
      <i class="fa-brands fa-linkedin-in"></i>
    </a>
    <!-- GitHub -->
    <a href="https://github.com/luanperretto" target="_blank" title="GitHub">
      <i class="fa-brands fa-github"></i>
    </a>
    <!-- Substack -->
    <a href="https://substack.com/@luanperretto" target="_blank" title="Substack">
      <i class="fa-solid fa-bookmark"></i>
    </a>
  </div>

  <!-- Seção Sobre -->
  <section id="sobre">
    <div class="bio">
      Editor de Geografia e cartógrafo explorando o Brasil e o mundo através de textos mapas e infográficos.
    </div>
  </section>

  <!-- Seção Trabalhos (Sequência de PNGs e GIFs) -->
  <section id="trabalhos">
    <h2 class="section-title">Trabalhos</h2>

    <div class="gallery">
      <img src="imagem1.png" alt="Trabalho 1">
      <img src="imagem2.png" alt="Trabalho 2">
      <img src="imagem3.png" alt="Trabalho 3">
      <img src="imagem4.png" alt="Trabalho 4">
      <img src="imagem5.gif" alt="Trabalho 5">
      <img src="imagem6.png" alt="Trabalho 6">
      <img src="imagem7.png" alt="Trabalho 7">
      <img src="imagem8.png" alt="Trabalho 8">
      <img src="imagem9.gif" alt="Trabalho 9">
      <img src="imagem10.png" alt="Trabalho 10">
    </div>
  </section>

</body>
</html>
